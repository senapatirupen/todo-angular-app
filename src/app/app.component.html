<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
  <div class="container">
    <a class="navbar-brand" routerLink="/">
      <i class="fas fa-check-circle me-2"></i>Todo Angular
    </a>
    
    <div class="navbar-nav ms-auto">
      <span *ngIf="currentUser" class="navbar-text me-3">
        <i class="fas fa-user me-1"></i>
        {{ currentUser.username }}
      </span>
      <a *ngIf="currentUser" class="nav-link" routerLink="/todos">
        <i class="fas fa-list me-1"></i>My Todos
      </a>
      <a *ngIf="currentUser" class="nav-link" (click)="logout()" style="cursor: pointer;">
        <i class="fas fa-sign-out-alt me-1"></i>Logout
      </a>
      <a *ngIf="!currentUser" class="nav-link" routerLink="/login">
        <i class="fas fa-sign-in-alt me-1"></i>Login
      </a>
    </div>
  </div>
</nav>

<!-- Main Content -->
<div class="container-fluid py-4">
  <router-outlet></router-outlet>
</div>

<!-- Toast Container -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <i class="fas fa-bell text-primary me-2"></i>
      <strong class="me-auto">Notification</strong>
      <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
    </div>
    <div class="toast-body" id="toastMessage">
      <!-- Toast message will appear here -->
    </div>
  </div>
</div>
